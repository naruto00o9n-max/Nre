name: Build unsigned iPhone IPA
"on":
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: java tests/CompileAndTest.java
      - run: bash tests/test-ios-core.sh
  ios:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode required by Expo SDK 57
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          swift --version
          pod --version
      - run: npm ci
      - name: Validate Swift syntax
        run: swiftc -frontend -parse modules/long-image/ios/*.swift
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: cd ios && pod install --repo-update
      - name: Build and package unsigned device IPA
        run: bash scripts/build-unsigned-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: manhwa-studio-unsigned-ipa
          path: |
            build/manhwa-studio-unsigned.ipa
            build/manhwa-studio-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            build/xcodebuild.log
            build/xcode-schemes.json
          if-no-files-found: ignore
          retention-days: 7
