name: Pro Image Editor unsigned IPA
"on":
  push:
    branches: [pro-image-editor]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pro-image-editor-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Fetch pinned official source
        run: |
          git clone --depth 1 https://github.com/hm21/pro_image_editor.git upstream
          git -C upstream fetch --depth 1 origin 8305f0f1d734c96fc3bfe1411e8104ec628753f7
          git -C upstream checkout --detach 8305f0f1d734c96fc3bfe1411e8104ec628753f7
      - name: Prepare official designs and native application
        run: |
          flutter --version
          flutter config --no-enable-swift-package-manager
          python3 scripts/prepare.py
          flutter create --no-pub --platforms=ios,android --org com.manhwa --project-name proimageeditortrial app
          python3 scripts/prepare.py
      - name: Resolve dependencies
        run: cd app && flutter pub get
      - name: Format and analyze application
        run: |
          cd app
          dart format lib
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          mkdir -p build
          cd app
          flutter build ios --release --no-codesign 2>&1 | tee ../build/flutter-ios.log
      - name: Package unsigned IPA
        run: bash scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pro-image-editor-unsigned-ipa
          path: |
            build/pro-image-editor-unsigned.ipa
            build/pro-image-editor-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload reproducible application source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-image-editor-source-and-diagnostics
          path: |
            build/flutter-ios.log
            app/pubspec.lock
            app/pubspec.yaml
            app/lib/
            upstream/LICENSE
          if-no-files-found: ignore
          retention-days: 14
